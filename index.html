<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="2〜4枚の分割画像を、自動で並べ替えて1枚に統合できます。" />
  <title>分割画像統合ツール</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%25%22 y=%2250%25%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>&#x1f5bc;</text></svg>" />
  <link rel="stylesheet" href="styles.css?v=20261002-1" />
</head>
<body>
  <main class="app-main">
      <div class="landing-intro">
        <div class="intro-copy">
          <h1>分割画像統合ツール</h1>
          <p class="hero-copy">2〜4枚の分割画像を選び、「自動で並べ替え」で順番を整えて1枚に統合できます。</p>
        </div>
        <p class="local-processing"><span aria-hidden="true">●</span>画像は端末内だけで処理</p>
      </div>
    <div class="workspace">
      <div class="workspace-left">
      <div class="upload-card">
        <div class="upload-field">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
          <button class="dropzone" id="dropzone" type="button" aria-describedby="uploadHelp">
            <svg class="drop-icon" viewBox="0 0 80 80" aria-hidden="true">
              <path d="M17 23v37a8 8 0 0 0 8 8h38" />
              <rect x="25" y="12" width="45" height="45" rx="7" />
              <circle cx="39" cy="26" r="3.5" />
              <path d="m31 49 12-14 8 9 6-7 8 12" />
            </svg>
            <strong id="dropzoneTitle">画像を追加</strong>
            <span>またはドラッグ＆ドロップ</span>
          </button>
          <p id="uploadHelp" class="upload-help">PNG・JPEG・WebP ／ 1枚20MBまで</p>
        </div>
        <p id="uploadError" class="error" role="alert"></p>
      </div>
    <aside id="controlsPanel" class="panel controls">
          <section class="order-area">
            <div class="order-heading">
              <h2>並び順</h2>
              <button id="autoOrderBtn" class="ai-order-btn" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 2.75c.5 3.83 2.42 5.75 6.25 6.25-3.83.5-5.75 2.42-6.25 6.25C11.5 11.42 9.58 9.5 5.75 9 9.58 8.5 11.5 6.58 12 2.75Z" />
                  <path d="M18.25 14.75c.24 1.83 1.17 2.76 3 3-1.83.24-2.76 1.17-3 3-.24-1.83-1.17-2.76-3-3 1.83-.24 2.76-1.17 3-3Z" />
                </svg>
                <span id="autoOrderLabel">自動で並べ替え</span>
                <span class="beta-badge">Beta</span>
              </button>
            </div>
            <p>左から右の順番です。ドラッグして移動できます。</p>
            <div id="imageList" class="image-list"><p class="empty-order">画像を追加してください</p></div>
            <p id="autoOrderStatus" class="auto-order-status" aria-live="polite"></p>
          </section>

          <details class="advanced-settings">
            <summary>詳細設定</summary>
            <section>
              <h2>高さの合わせ方</h2>
              <label><input type="radio" name="heightMode" value="max" checked /> 最大高さに合わせる</label>
              <label><input type="radio" name="heightMode" value="min" /> 最小高さに合わせる</label>
            </section>

            <section>
              <h2>境界ブレンド</h2>
              <label class="range-label"><span>左右に重ねる幅</span><output id="blendValue">0 px</output></label>
              <div class="blend-control">
                <button id="blendMinus" type="button" aria-label="ブレンド幅を1ピクセル減らす">−</button>
                <input id="blendRange" type="range" min="0" max="120" value="0" />
                <button id="blendPlus" type="button" aria-label="ブレンド幅を1ピクセル増やす">＋</button>
              </div>
              <label><input id="seamToggle" type="checkbox" /> 境界ガイドを表示</label>
            </section>
          </details>
    </aside>
      </div>

    <section id="previewPanel" class="panel preview-panel">
          <div class="preview-head">
            <h2>プレビュー</h2>
            <span id="sizeLabel">—</span>
          </div>
          <p id="previewOrderHint" class="preview-order-hint">画像を左右にドラッグして並べ替えできます。</p>
          <div class="canvas-stage">
            <canvas id="previewCanvas" aria-label="統合画像のプレビュー" aria-describedby="previewOrderHint"></canvas>
            <div id="previewDropTarget" class="preview-drop-target" hidden aria-hidden="true"></div>
          </div>
          <div class="action-row">
            <span id="saveHint">分割画像から推定した順番で1枚に復元します</span>
            <button id="saveBtn" class="primary-btn">復元画像を保存</button>
          </div>
    </section>
    </div>
  </main>

  <footer class="site-footer">
    <small>(c) 2026 fjtd</small>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20261002-1"></script>
</body>
</html>
